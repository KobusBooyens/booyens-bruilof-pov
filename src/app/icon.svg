<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="K&amp;S">
  <!-- Rustic film-strip monogram for Kobus & Simoné -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#372E26"/>
  <!-- Film sprocket holes down each edge -->
  <g fill="#F4EEE2" opacity="0.9">
    <rect x="7" y="12" width="5" height="7" rx="1.6"/>
    <rect x="7" y="28.5" width="5" height="7" rx="1.6"/>
    <rect x="7" y="45" width="5" height="7" rx="1.6"/>
    <rect x="52" y="12" width="5" height="7" rx="1.6"/>
    <rect x="52" y="28.5" width="5" height="7" rx="1.6"/>
    <rect x="52" y="45" width="5" height="7" rx="1.6"/>
  </g>
  <!-- Sage frame line to echo the app palette -->
  <rect x="16" y="9" width="32" height="46" rx="4" fill="none" stroke="#7E8B6A" stroke-width="1.5" opacity="0.55"/>
  <!-- K&S monogram -->
  <text x="32" y="41" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#F4EEE2" letter-spacing="-1">K<tspan fill="#B9764F" font-size="17" dy="-1">&amp;</tspan><tspan dy="1">S</tspan></text>
</svg>
